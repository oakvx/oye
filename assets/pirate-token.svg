<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Fortnite Pirate Shop Token">
  <defs>
    <radialGradient id="sunburstGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#eab308" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="coinFace" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="coinClip">
      <circle cx="200" cy="200" r="102"/>
    </clipPath>
  </defs>

  <style>
    @keyframes spinRays { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseGlow { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(250, 204, 21, 0.4)); } 50% { transform: scale(1.02); filter: drop-shadow(0 0 24px rgba(250, 204, 21, 0.85)); } }
    @keyframes sweep { 0% { transform: translateX(-160px) rotate(25deg); } 25%, 100% { transform: translateX(260px) rotate(25deg); } }
    .rays { transform-origin: 200px 200px; animation: spinRays 28s linear infinite; }
    .token-body { transform-origin: 200px 200px; animation: pulseGlow 3s ease-in-out infinite; }
    .shimmer-bar { transform-origin: 200px 200px; animation: sweep 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
  </style>

  <g class="rays">
    <path d="M200 200 L185 20 L215 20 Z M200 200 L380 185 L380 215 Z M200 200 L215 380 L185 380 Z M200 200 L20 215 L20 185 Z M200 200 L325 75 L345 95 Z M200 200 L345 305 L325 325 Z M200 200 L75 325 L55 305 Z M200 200 L55 95 L75 75 Z" fill="url(#sunburstGrad)"/>
    <circle cx="200" cy="200" r="180" fill="url(#sunburstGrad)"/>
  </g>

  <g class="token-body" filter="url(#goldGlow)">
    <polygon points="200,16 220,135 200,135" fill="url(#goldLight)"/>
    <polygon points="200,16 180,135 200,135" fill="url(#goldDark)"/>
    <polygon points="200,384 180,265 200,265" fill="url(#goldLight)"/>
    <polygon points="200,384 220,265 200,265" fill="url(#goldDark)"/>
    <polygon points="384,200 265,180 265,200" fill="url(#goldLight)"/>
    <polygon points="384,200 265,220 265,200" fill="url(#goldDark)"/>
    <polygon points="16,200 135,220 135,200" fill="url(#goldLight)"/>
    <polygon points="16,200 135,180 135,200" fill="url(#goldDark)"/>
    <polygon points="330,70 245,155 233,143" fill="url(#goldLight)"/>
    <polygon points="330,70 257,167 245,155" fill="url(#goldDark)"/>
    <polygon points="330,330 257,233 245,245" fill="url(#goldLight)"/>
    <polygon points="330,330 245,245 233,257" fill="url(#goldDark)"/>
    <polygon points="70,330 155,245 167,257" fill="url(#goldLight)"/>
    <polygon points="70,330 143,233 155,245" fill="url(#goldDark)"/>
    <polygon points="70,70 143,167 155,155" fill="url(#goldLight)"/>
    <polygon points="70,70 155,155 167,143" fill="url(#goldDark)"/>

    <circle cx="200" cy="200" r="118" fill="url(#goldDark)" stroke="#fef08a" stroke-width="2"/>
    <circle cx="200" cy="200" r="110" fill="url(#goldLight)"/>
    <circle cx="200" cy="200" r="104" fill="#451a03"/>

    <g clip-path="url(#coinClip)">
      <circle cx="200" cy="200" r="102" fill="url(#coinFace)"/>
      <circle cx="200" cy="200" r="88" fill="none" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8 4"/>
      <circle cx="200" cy="200" r="80" fill="none" stroke="#78350f" stroke-width="1.5"/>
      <path d="M 166 128 H 244 V 162 H 202 V 186 H 236 V 218 H 202 V 276 H 166 Z" fill="#291102" opacity="0.65" transform="translate(4, 5)"/>
      <path d="M 166 128 H 244 V 162 H 202 V 186 H 236 V 218 H 202 V 276 H 166 Z" fill="url(#goldLight)" stroke="#78350f" stroke-width="3"/>
      <path d="M 170 132 H 240 V 158 H 206 V 190 H 232 V 214 H 206 V 272 H 170 Z" fill="#ffffff"/>
      <rect class="shimmer-bar" x="120" y="80" width="38" height="240" fill="url(#shimmer)"/>
    </g>

    <circle cx="200" cy="92" r="3.5" fill="#fef08a"/>
    <circle cx="200" cy="308" r="3.5" fill="#fef08a"/>
    <circle cx="92" cy="200" r="3.5" fill="#fef08a"/>
    <circle cx="308" cy="200" r="3.5" fill="#fef08a"/>
  </g>
</svg>