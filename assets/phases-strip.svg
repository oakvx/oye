<svg xmlns="http://www.w3.org/2000/svg" width="760" height="130" viewBox="0 0 760 130" role="img" aria-label="Oye match loop phases">
  <defs>
    <style>
      @import url('https://fonts.cdnfonts.com/css/burbank-big-condensed-black');
      .burbank-title { font-family: 'Burbank Big Condensed', 'Burbank', 'Impact', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: 0.8px; font-size: 15px; }
      .burbank-sub { font-family: 'Burbank Big Condensed', 'Burbank', 'Impact', sans-serif; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
      .step1 { animation: pulse1 8s infinite; }
      .step2 { animation: pulse2 8s infinite; }
      .step3 { animation: pulse3 8s infinite; }
      .step4 { animation: pulse4 8s infinite; }
      @keyframes pulse1 { 0%, 22% { stroke: #38bdf8; stroke-width: 2.5; fill: #14233a; } 25%, 100% { stroke: #26293e; stroke-width: 1.5; fill: #111422; } }
      @keyframes pulse2 { 0%, 24% { stroke: #26293e; fill: #111422; } 25%, 47% { stroke: #a855f7; stroke-width: 2.5; fill: #241438; } 50%, 100% { stroke: #26293e; fill: #111422; } }
      @keyframes pulse3 { 0%, 49% { stroke: #26293e; fill: #111422; } 50%, 72% { stroke: #a855f7; stroke-width: 2.5; fill: #241438; } 75%, 100% { stroke: #26293e; fill: #111422; } }
      @keyframes pulse4 { 0%, 74% { stroke: #26293e; fill: #111422; } 75%, 97% { stroke: #facc15; stroke-width: 3; fill: #2e2208; } 100% { stroke: #26293e; fill: #111422; } }
    </style>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="goldCoinMini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="goldGlowMini">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="752" height="122" rx="14" fill="#0b0d14" stroke="#212538" stroke-width="2"/>
  <rect x="110" y="63" width="540" height="6" rx="3" fill="#1b1f2e"/>
  <rect x="110" y="64" width="540" height="4" rx="2" fill="url(#barGrad)" opacity="0.75"/>
  <circle cx="110" cy="66" r="8" fill="#facc15" filter="url(#goldGlowMini)">
    <animate attributeName="cx" values="110;290;470;650;110" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="110" cy="66" r="3.5" fill="#ffffff">
    <animate attributeName="cx" values="110;290;470;650;110" keyTimes="0;0.25;0.5;0.75;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <rect class="step1" x="35" y="24" width="150" height="82" rx="10"/>
  <text class="burbank-title" x="110" y="58" fill="#e2e8f0" text-anchor="middle">1. LOBBY</text>
  <text class="burbank-sub" x="110" y="80" fill="#38bdf8" text-anchor="middle">OCR + HUD RECOG</text>
  <rect class="step2" x="215" y="24" width="150" height="82" rx="10"/>
  <text class="burbank-title" x="290" y="58" fill="#e2e8f0" text-anchor="middle">2. GIOCA</text>
  <text class="burbank-sub" x="290" y="80" fill="#c084fc" text-anchor="middle">AUTO QUEUE (X3)</text>
  <rect class="step3" x="395" y="24" width="150" height="82" rx="10"/>
  <text class="burbank-title" x="470" y="58" fill="#e2e8f0" text-anchor="middle">3. MATCH LOOP</text>
  <text class="burbank-sub" x="470" y="80" fill="#c084fc" text-anchor="middle">IGNORANTE MODE</text>
  <rect class="step4" x="575" y="24" width="150" height="82" rx="10"/>
  <g transform="translate(600, 52)" filter="url(#goldGlowMini)">
    <polygon points="0,-16 3,-5 0,-5" fill="#fde047"/>
    <polygon points="0,-16 -3,-5 0,-5" fill="#ca8a04"/>
    <polygon points="0,16 -3,5 0,5" fill="#fde047"/>
    <polygon points="0,16 3,5 0,5" fill="#ca8a04"/>
    <polygon points="16,0 5,3 5,0" fill="#fde047"/>
    <polygon points="16,0 5,-3 5,0" fill="#ca8a04"/>
    <polygon points="-16,0 -5,-3 -5,0" fill="#fde047"/>
    <polygon points="-16,0 -5,3 -5,0" fill="#ca8a04"/>
    <circle cx="0" cy="0" r="11" fill="url(#goldCoinMini)" stroke="#451a03" stroke-width="1.2"/>
    <path d="M -3 -6 H 4 V -3.5 H 0 V -1.5 H 3 V 0.5 H 0 V 6 H -3 Z" fill="#ffffff"/>
  </g>
  <text class="burbank-title" x="654" y="58" fill="#facc15" text-anchor="middle">PIRATE TOKEN</text>
  <text class="burbank-sub" x="650" y="80" fill="#fef08a" text-anchor="middle">SQUAD CHEST DROP</text>
</svg>