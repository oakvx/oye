<svg xmlns="http://www.w3.org/2000/svg" width="230" height="180" viewBox="0 0 230 180" role="img" aria-label="Fortnite HUD OCR Scanner">
  <defs>
    <style>
      @import url('https://fonts.cdnfonts.com/css/burbank-big-condensed-black');
      .hud-title { font-family: 'Burbank Big Condensed', 'Burbank', 'Impact', sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
      .hud-mono { font-family: 'Fira Code', Consolas, monospace; font-size: 10px; font-weight: 700; }
    </style>
    <linearGradient id="scanGlow" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="210" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="15" y="15" width="200" height="150" rx="8"/>
    </clipPath>
  </defs>
  <rect x="4" y="4" width="222" height="172" rx="12" fill="#0b0e14" stroke="#242b3d" stroke-width="2"/>
  <g clip-path="url(#screenClip)">
    <rect x="15" y="15" width="200" height="150" fill="#101522"/>
    <line x1="115" y1="20" x2="115" y2="160" stroke="#1d263b" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="20" y1="90" x2="210" y2="90" stroke="#1d263b" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="65" y="118" width="100" height="28" rx="5" fill="#facc15" stroke="#78350f" stroke-width="1.5">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text class="hud-title" x="115" y="137" fill="#451a03" text-anchor="middle">GIOCA [READY]</text>
    <rect x="15" y="15" width="200" height="4" fill="url(#scanGlow)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 145; 0 0" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M15 42 V15 H42 M188 15 H215 V42 M215 138 V165 H188 M42 165 H15 V138" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="38" r="4" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text class="hud-mono" x="42" y="41" fill="#e2e8f0">HUD: LOBBY_DETECTED</text>
  <text class="hud-mono" x="30" y="65" fill="#94a3b8">ACCURACY: 98.4%</text>
  <text class="hud-mono" x="30" y="80" fill="#a855f7">SQUAD MODE: ACTIVE</text>
</svg>